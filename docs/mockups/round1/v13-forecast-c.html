<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forecast · C Year ladder</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@500;600;700&family=Gabarito:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="v13-shared.css"><script src="v13-data.js"></script><script src="v13-fc.js"></script><script src="v13-shared.js"></script>
<style>
.ladder{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media(max-width:759px){.ladder{grid-template-columns:1fr}}
.yr{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:14px;text-align:left;cursor:pointer;color:inherit;width:100%;display:block;box-shadow:var(--shadow)}
.yr[aria-expanded=true]{border-color:var(--accent);background:var(--tint)}
.yr.est{border-style:dashed}
.yr .t{font:800 22px Gabarito;letter-spacing:-.02em}
.yr .stk{display:flex;height:12px;border-radius:999px;overflow:hidden;margin:10px 0 8px;background:var(--soft)}
.yr .stk i{display:block;height:100%}
.yr .fl{display:flex;justify-content:space-between;font-size:13px;padding:2px 0}
@media(max-width:759px){.yr{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}}
.mgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media(max-width:759px){.mgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mc{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px;text-align:left;cursor:pointer;color:inherit;min-height:104px;display:flex;flex-direction:column;gap:6px}
.mc:hover{border-color:var(--muted)}
.mc.ov{border-color:var(--ink)}
.mc .m{display:flex;justify-content:space-between;font-weight:800;font-size:14px}
.mc .stk{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--soft)}.mc .stk i{display:block}
.mc .p{font:800 15px Gabarito;font-variant-numeric:tabular-nums}
.mc .tags{display:flex;gap:4px;flex-wrap:wrap}
.mc .tags .pill{font-size:11px;padding:1px 8px}
</style></head><body data-nav="forecast">
<main><div class="stack l">
 <div class="row sp wrap"><div><h1>Where I'll be</h1><div class="lbl">Five years as five steps. Open a year for its twelve months.</div></div>
  <div class="row wrap"><div class="seg" id="scn" aria-label="Scenario"></div><span class="pill" id="delta"></span></div></div>

 <section class="ladder" id="ladder" aria-label="Years"></section>
 <div class="legend" id="leg"></div>

 <section class="card" aria-labelledby="yh"><div class="row sp wrap"><h2 id="yh"></h2><div class="row wrap"><button class="btn sm" id="applyrng">Apply an order to a range…</button></div></div>
  <div class="mgrid" id="mgrid" style="margin-top:12px"></div>
  <div class="xs muted" style="margin-top:10px">Each bar splits the month's savings pool by fund. <span class="pill" style="font-size:11px;padding:1px 8px">Changed</span> marks an override. Gift icon = bonus month.</div></section>
</div></main>

<div class="scrim" id="scrim"></div>
<section class="sheet sheetfix" id="mo" role="dialog" aria-modal="true" aria-labelledby="mot"><div class="grab"></div>
 <div class="row sp"><h2 id="mot"></h2><button class="iconbtn s" id="mx" aria-label="Close"></button></div><div id="mob" style="margin-top:12px"></div>
 <div class="row wrap" style="margin-top:14px"><a class="btn pri" id="mlink" href="v13-override-c.html">Override this month</a></div></section>

<script>
const P=BY.peso,F=BY.FUNDS;let yr=2027;
function render(){
 const rows=FC.run(),S=BY.SCENARIOS[FC.scn],steady=FC.run('base');
 $('#scn').innerHTML=Object.values(BY.SCENARIOS).map(s=>`<button data-v="${s.id}" aria-pressed="${s.id===FC.scn}">${s.name}</button>`).join('');
 const T=r=>F.reduce((s,f)=>s+r.bal[f.id],0),d=T(rows[59])-T(steady[59]);
 $('#delta').className='pill '+(d>0?'ok':d<0?'warn':'');$('#delta').textContent=FC.scn==='base'?'The baseline':(d>0?'+':'−')+P(Math.abs(d)).replace('−','')+' vs Steady by 2031';
 const ys=[2027,2028,2029,2030,2031];
 $('#ladder').innerHTML=ys.map(y=>{const e=rows.filter(r=>r.y===y).slice(-1)[0],tot=T(e),est=e.assumed;
  const mx=Math.max(...rows.map(T));
  return `<button class="yr ${est?'est':''}" data-y="${y}" aria-expanded="${y===yr}" aria-controls="mgrid"><div><div class="t">${y}${est?'*':''}</div><div class="xs muted">end of year</div></div><div><div class="num" style="font:800 18px Gabarito">${P(tot)}</div><div class="stk" role="img" aria-label="Split by fund">${F.slice().reverse().map(f=>`<i style="width:${e.bal[f.id]/tot*100}%;background:${f.color}"></i>`).join('')}</div>
  <div class="xs muted">Take-home ${P(e.cutoff)} / cutoff</div></div></button>`}).join('');
 $('#leg').innerHTML=F.map(f=>`<span><i class="dot" style="background:${f.color}"></i>${f.name}</span>`).join('')+'<span class="muted">* uses assumed raises, drawn dashed</span>';
 $('#yh').textContent=yr+' month by month';
 $('#mgrid').innerHTML=rows.filter(r=>r.y===yr).map(r=>{const parts=F.map(f=>r.alloc[f.id].amt+(r.bonusTo[f.id]||0)),tot=parts.reduce((a,b)=>a+b,0)||1;
  return `<button class="mc ${r.over?'ov':''}" data-ym="${r.ym}" aria-label="${BY.ymLabel(r.ym)}: ${P(tot)} saved${r.over?', overridden':''}${r.bonus?', '+r.bonus.name+' month':''}"><span class="m"><span>${BY.MON[r.mo-1]}</span>${r.bonus?icon('gift'):''}</span><span class="p">${P(tot)}</span><span class="stk">${F.map((f,i)=>`<i style="width:${parts[i]/tot*100}%;background:${f.color}"></i>`).join('')}</span><span class="tags">${r.over?'<span class="pill">Changed</span>':''}${r.overspent?'<span class="pill bad">Over</span>':r.tight?'<span class="pill warn">Tight</span>':''}</span></button>`}).join('');
}
function openMonth(ym){const r=FC.run().find(x=>x.ym===ym);$('#mot').textContent=BY.ymLabel(ym);$('#mob').innerHTML=FC.detail(r);$('#mlink').href='v13-override-c.html#'+ym;$('#mo').classList.add('on');$('#scrim').classList.add('on');$('#mx').focus()}
function closeMonth(){$('#mo').classList.remove('on');$('#scrim').classList.remove('on')}
$('#mx').innerHTML=icon('x');$('#mx').onclick=$('#scrim').onclick=closeMonth;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMonth()});
seg($('#scn'),v=>{FC.scn=v;render()});
$('#ladder').addEventListener('click',e=>{const b=e.target.closest('[data-y]');if(b){yr=+b.dataset.y;render();$(`[data-y="${yr}"]`).focus()}});
$('#mgrid').addEventListener('click',e=>{const b=e.target.closest('[data-ym]');if(b)openMonth(b.dataset.ym)});
$('#applyrng').onclick=()=>{location.href='v13-override-b.html'};
render();
</script></body></html>
