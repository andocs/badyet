<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bad(yet) · Gallery 4 · Finance</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g-bg:#0C1118;--g-ink:#F1F2F5;--g-mu:#A5AAB5;--g-ln:#28323F}
*{box-sizing:border-box}
body{margin:0;background:var(--g-bg);color:var(--g-ink);font:15px/1.4 system-ui,sans-serif;display:flex;flex-direction:column;height:100vh}
.bar{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--g-ln);flex-wrap:wrap}
.bar b{font-size:16px}.bar p{margin:0;color:var(--g-mu);flex:1;min-width:200px}
.bar button{font:inherit;color:var(--g-ink);background:#1B2430;border:1px solid var(--g-ln);border-radius:8px;padding:7px 14px;min-height:38px;cursor:pointer}
.bar button[aria-pressed=true]{background:var(--g-ink);color:var(--g-bg)}
.dots{display:flex;gap:6px}.dots button{padding:0 10px;min-width:38px}
.wrap{flex:1;overflow:auto;display:flex;justify-content:center;padding:18px;background:#070B10}
.frame{width:100%;max-width:1280px;border-radius:14px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.5);align-self:flex-start;min-height:calc(100vh - 150px);transition:max-width .25s;position:relative}
.frame.phone{max-width:390px}
/* ===== design scope ===== */
.d{background:var(--bg);color:var(--ink);font:500 15px/1.45 Manrope,sans-serif;container-type:inline-size;min-height:inherit;position:relative;overflow:hidden}
.d *{box-sizing:border-box}
.d h1,.d h2,.d .disp{font-family:"Plus Jakarta Sans",sans-serif;font-weight:800;letter-spacing:-.025em}
.d h1{font-size:30px;line-height:1.12;margin:0}.d h2{font-size:18px;margin:0 0 12px}
.d .lab{font-size:13px;font-weight:600;color:var(--mu)}
.d .num{font-variant-numeric:tabular-nums;font-weight:700;font-family:Manrope,sans-serif}
.d .sub{color:var(--mu);margin:4px 0 0}
.d .card{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:20px;box-shadow:var(--sh)}
.d .btn{font:700 14px "Plus Jakarta Sans",sans-serif;background:var(--ac);color:var(--oa);border:0;border-radius:999px;padding:10px 20px;min-height:42px;cursor:pointer;transition:transform .14s cubic-bezier(.16,1,.3,1),filter .14s}
.d .btn:hover{filter:brightness(1.06);transform:translateY(-1px)}.d .btn:active{transform:scale(.97)}
.d .gh{background:var(--soft);color:var(--ink)}.d .glass{background:rgba(255,255,255,.14);color:#fff}
.d .pill{display:inline-flex;align-items:center;font:700 12px Manrope,sans-serif;border-radius:999px;padding:4px 10px;background:var(--tint);color:var(--act);white-space:nowrap}
.d .pill.w{background:var(--soft);color:var(--mu)}
.d .app{display:grid;grid-template-columns:208px 1fr;min-height:inherit}
.d .rail{background:var(--rl);color:var(--rli);padding:22px 12px;border-right:1px solid var(--ln)}
.d .rail b{display:flex;align-items:center;gap:9px;font:800 20px "Plus Jakarta Sans",sans-serif;padding:0 10px 18px;letter-spacing:-.02em}
.d .rail b i{width:26px;height:26px;border-radius:9px;background:linear-gradient(135deg,var(--ac),var(--b2));display:block}
.d .rail a{display:block;padding:10px 12px;border-radius:12px;color:inherit;opacity:.78;text-decoration:none;margin-bottom:2px;font-weight:600}
.d .rail a:hover{opacity:1;background:var(--soft)}.d .rail a.on{background:var(--tint);color:var(--act);opacity:1;font-weight:700}
.d .main{padding:24px 28px 50px}
.d .head{display:flex;justify-content:space-between;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:20px}
.d .g2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:18px;align-items:start}
.d .g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.d .g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.d .stack{display:grid;gap:18px}.d .mt{margin-top:18px}
.d .pr{height:10px;background:var(--soft);border-radius:999px;overflow:hidden}.d .pr i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--ac),var(--b2));animation:grow 1s cubic-bezier(.16,1,.3,1) both}
@keyframes grow{from{width:0}}
.d .row{display:flex;justify-content:space-between;gap:10px;align-items:center;min-height:46px;border-top:1px solid var(--ln)}.d .row:first-child{border-top:0}
.d .dt{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:8px}
/* hero */
.d .hero{background:var(--hg);color:#fff;border-radius:28px;padding:28px;position:relative;overflow:hidden;border:0}
.d .hero::before{content:"";position:absolute;right:-70px;top:-90px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,var(--gl),transparent 65%)}
.d .hero>*{position:relative}.d .hero .lab,.d .hero .sub{color:#B9D4E8}
.d .bal{font:800 52px/1.05 "Plus Jakarta Sans",sans-serif;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:8px 0 12px;animation:rise2 .7s cubic-bezier(.16,1,.3,1) both}.d .bal small{font-size:.5em;opacity:.8;margin-right:4px}
@keyframes rise2{from{opacity:0;transform:translateY(8px)}}
.d .hero .pill{background:rgba(255,255,255,.16);color:#fff}
.d .mas{width:var(--ms,120px);height:var(--ms,120px);flex:none;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}
.d.hp .mas .m1{display:none}.d:not(.hp) .mas .m2{display:none}
/* transactions */
.d .tx{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;min-height:62px;border-top:1px solid var(--ln);animation:pop .45s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i)*60ms)}.d .tx:first-child{border-top:0}
.d .av{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font:800 15px "Plus Jakarta Sans",sans-serif;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.d .tx .nm{font-weight:700}.d .tx .r{text-align:right}.d .tx .r div{font-size:16px}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
/* wallet cards */
.d .wc{border-radius:20px;padding:16px;color:#fff;background:linear-gradient(135deg,var(--k),color-mix(in srgb,var(--k) 55%,#000));position:relative;min-height:128px;display:flex;flex-direction:column;justify-content:space-between;animation:pop .5s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i)*70ms)}
.d .wc::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.12)}
.d .wc .chip{width:30px;height:22px;border-radius:6px;background:linear-gradient(135deg,#F6D98B,#D9A73F)}
.d .wc .a{font:800 21px "Plus Jakarta Sans",sans-serif;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.d .wc small{opacity:.85}
.d .cf{position:absolute;width:9px;height:14px;border-radius:2px;pointer-events:none;animation:fall 1.2s ease-out forwards;z-index:30}
@keyframes fall{to{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}
.d .mnav{display:none}
@media (prefers-reduced-motion:reduce){.d *{animation:none!important}}
@container (max-width:760px){
 .d .app{grid-template-columns:1fr}.d .rail{display:none}.d .main{padding:16px 14px 90px}.d h1{font-size:25px}
 .d .g2,.d .g3{grid-template-columns:1fr}.d .g4{grid-template-columns:1fr 1fr}.d .bal{font-size:40px}.d .hero{padding:20px}.d .mas{--ms:84px}
 .d .mnav{display:grid;grid-template-columns:repeat(5,1fr);position:sticky;bottom:0;background:var(--sf);border-top:1px solid var(--ln);z-index:5}
 .d .mnav a{text-align:center;padding:14px 2px;font-size:12px;font-weight:600;color:var(--mu);text-decoration:none}.d .mnav a.on{color:var(--act);font-weight:800;box-shadow:inset 0 3px 0 var(--ac)}}
</style></head><body>
<div class="bar"><b>Bad(yet) gallery 4</b><p id="desc"></p><div class="dots" id="dots"></div><button id="prev" aria-label="Previous">←</button><button id="nxt" aria-label="Next">→</button><button id="mode">Light / Dark</button><button id="dk" aria-pressed="true">Desktop</button><button id="ph" aria-pressed="false">Phone</button></div>
<div class="wrap"><div class="frame" id="frame"></div></div>
<script>
const T=o=>Object.entries(o).map(([k,v])=>`--${k}:${v}`).join(";");
const LIGHT={bg:"#F2F5F9",sf:"#FFFFFF",soft:"#E8EEF5",ink:"#0E1B2E",mu:"#556579",ln:"#E1E8F0",ac:"#087A5A",act:"#087A5A",oa:"#FFFFFF",tint:"#DDF5EC",b2:"#2F5BD7",c1:"#2F5BD7",c2:"#087A5A",c3:"#C23A3A",c4:"#7A3FB8",bu1:"#087A5A",bu2:"#2F5BD7",bu3:"#C9871A",rl:"#FFFFFF",rli:"#0E1B2E",sh:"0 6px 20px rgba(14,27,46,.05)",hg:"linear-gradient(135deg,#0F2A4A,#0B6B5C)",gl:"rgba(52,211,153,.4)"};
const NIGHT={bg:"#0A1320",sf:"#101C2E",soft:"#17263B",ink:"#E8EEF7",mu:"#93A5BD",ln:"#223349",ac:"#34D399",act:"#5EE6B4",oa:"#04281C",tint:"#0F3A33",b2:"#7FA8FF",c1:"#7FA8FF",c2:"#34D399",c3:"#FF8A8A",c4:"#C4A0FF",bu1:"#34D399",bu2:"#7FA8FF",bu3:"#F6C453",rl:"#0C1726",rli:"#93A5BD",sh:"none",hg:"linear-gradient(135deg,#10294A,#0B5A4E)",gl:"rgba(52,211,153,.35)"};
const DES=[
{n:"Night",l:1,dark:1,d:"Dark hero with a big balance, Pip the coin, savings forecast, cutoff bars and a transaction list."},
{n:"Daylight",l:2,dark:0,d:"Light, gradient hero, wallet cards, donut, wallet bars and a 13th month countdown ring."},
{n:"Control Room",l:3,dark:1,d:"Dense data view: forecast, split donut, cutoff bars, wallet bars and the full transfer list."}
];
const flip=[0,0,0];
const WN=["Gcash","Maya","BPI","Vybe"],K=["#2F5BD7","#087A5A","#B03030","#7A3FB8"],C=i=>`var(--c${i+1})`,f=n=>n.toLocaleString("en-PH",{minimumFractionDigits:2});
const LN=[["Transpo","Essentials",0,2400,1],["Food","Essentials",0,2000,1],["Contingency","Essentials",0,550],["Rent share","Essentials",2,3000],["Internet","Essentials",1,1299],["Installments","Essentials",2,3000],["Wants","Wants",2,5200],["Emergency fund","Savings",1,4000],["Travel fund","Savings",3,2001]];
const ws=i=>LN.filter(l=>l[2]==i).reduce((a,l)=>a+l[3],0);
const nav=["Dashboard","Cutoff","Pay","Budget","Installments","Subscriptions","Bonuses","Savings"];
const rail=`<nav class="rail"><b><i></i>Bad(yet)</b>${nav.map((x,i)=>`<a href="#" class="${i?"":"on"}">${x}</a>`).join("")}</nav>`;
const mnav=`<nav class="mnav"><a class="on" href="#">Home</a><a href="#">Cutoff</a><a href="#">Budget</a><a href="#">Savings</a><a href="#">More</a></nav>`;
const mascot=s=>`<svg class="mas" viewBox="0 0 120 120" style="${s||""}" role="img" aria-label="Pip the coin"><ellipse cx="60" cy="112" rx="30" ry="5" fill="#000" opacity=".15"/><circle cx="60" cy="62" r="46" fill="#F2B100"/><circle cx="60" cy="62" r="36" fill="#FFD24D"/><circle cx="60" cy="62" r="36" fill="none" stroke="#E09A00" stroke-width="2" stroke-dasharray="3 6"/><ellipse cx="46" cy="57" rx="5" ry="7" fill="#10302B"/><ellipse cx="74" cy="57" rx="5" ry="7" fill="#10302B"/><circle cx="47.5" cy="54" r="1.8" fill="#fff"/><circle cx="75.5" cy="54" r="1.8" fill="#fff"/><circle cx="37" cy="71" r="6" fill="#FF8A66" opacity=".7"/><circle cx="83" cy="71" r="6" fill="#FF8A66" opacity=".7"/><path class="m1" d="M51 75 Q60 81 69 75" stroke="#10302B" stroke-width="3.5" fill="none" stroke-linecap="round"/><path class="m2" d="M49 71 Q60 89 71 71 Z" fill="#10302B"/><path d="M60 16 Q60 6 60 6" stroke="#2E9E5B" stroke-width="4" stroke-linecap="round"/><path d="M60 8 Q48 0 42 10 Q54 16 60 8Z" fill="#34D399"/><path d="M60 8 Q72 0 78 10 Q66 16 60 8Z" fill="#2E9E5B"/></svg>`;
const tx=(k,all)=>LN.filter(l=>all||!l[4]).slice(0,k).map((l,j)=>`<div class="tx" style="--c:${C(l[2])};--i:${j}"><span class="av">${WN[l[2]][0]}</span><div><div class="nm">${l[0]}</div><span class="lab">To ${WN[l[2]]} · ${l[1]}</span></div><div class="r"><div class="num">${f(l[3])}</div><span class="pill ${l[4]?"":"w"}">${l[4]?"Sent":"Pending"}</span></div></div>`).join("");
function donut(size=150){const parts=[["Essentials",12249,"var(--bu1)"],["Wants",5200,"var(--bu2)"],["Savings",6001,"var(--bu3)"]],tot=23450,r=62,cir=2*Math.PI*r;let off=0;return `<svg viewBox="0 0 170 170" width="${size}" height="${size}" role="img" aria-label="Budget split"><circle cx="85" cy="85" r="${r}" fill="none" stroke="var(--soft)" stroke-width="20"/>${parts.map(p=>{const len=p[1]/tot*cir,e=`<circle cx="85" cy="85" r="${r}" fill="none" stroke="${p[2]}" stroke-width="20" stroke-linecap="round" stroke-dasharray="${len-8} ${cir-len+8}" stroke-dashoffset="${-off-4}" transform="rotate(-90 85 85)" style="animation:fadein .8s ${off/cir}s both"/>`;off+=len;return e}).join("")}<text x="85" y="86" text-anchor="middle" font-family="Plus Jakarta Sans" font-weight="800" font-size="20" fill="var(--ink)">23,450</text><text x="85" y="104" text-anchor="middle" font-family="Manrope" font-weight="600" font-size="11" fill="var(--mu)">Take-home</text></svg>`}
const legend=`<div style="flex:1;min-width:150px">${[["Essentials",12249,"var(--bu1)"],["Wants",5200,"var(--bu2)"],["Savings",6001,"var(--bu3)"]].map(b=>`<div class="row"><span><span class="dt" style="--c:${b[2]}"></span>${b[0]}</span><span class="num">${f(b[1])}</span></div>`).join("")}</div>`;
function area(w=520,h=180){const pts=[38,43,48,52,56,60,60],cap=60,mx=64,x=i=>34+i*(w-56)/6,y=v=>h-26-v/mx*(h-46);const d=pts.map((v,i)=>(i?"L":"M")+x(i)+" "+y(v)).join(" ");const mo=["Dec","Jan","Feb","Mar","Apr","May","Jun"];
return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Emergency fund reaches its 60k cap in June"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--ac)" stop-opacity=".4"/><stop offset="1" stop-color="var(--ac)" stop-opacity="0"/></linearGradient></defs>${[0,20,40,60].map(v=>`<line x1="34" x2="${w-20}" y1="${y(v)}" y2="${y(v)}" stroke="var(--ln)"/><text x="2" y="${y(v)+4}" font-size="11" font-weight="600" font-family="Manrope" fill="var(--mu)">${v}k</text>`).join("")}<line x1="34" x2="${w-20}" y1="${y(cap)}" y2="${y(cap)}" stroke="var(--bu3)" stroke-dasharray="5 5" stroke-width="2"/><path d="${d} L${x(6)} ${y(0)} L${x(0)} ${y(0)} Z" fill="url(#ag)"/><path d="${d}" fill="none" stroke="var(--ac)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" pathLength="1" style="stroke-dasharray:1;animation:draw 1.4s cubic-bezier(.16,1,.3,1) both"/>${pts.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="4.5" fill="var(--sf)" stroke="var(--ac)" stroke-width="3"/>`).join("")}${mo.map((m,i)=>`<text x="${x(i)}" y="${h-6}" text-anchor="middle" font-size="11" font-weight="600" font-family="Manrope" fill="var(--mu)">${m}</text>`).join("")}<text x="${w-22}" y="${y(cap)-8}" text-anchor="end" font-size="11" font-weight="800" font-family="Manrope" fill="var(--bu3)">Cap 60k</text></svg>`}
function stacked(){const a=[[12249,"var(--bu1)"],[5200,"var(--bu2)"],[6001,"var(--bu3)"]],b=[[10550,"var(--bu1)"],[5500,"var(--bu2)"],[8050,"var(--bu3)"]];const col=(L,x,lab)=>{let y=150;return L.map(p=>{const h=p[0]/24100*130;y-=h;return `<rect x="${x}" y="${y}" width="74" height="${h-2}" rx="9" fill="${p[1]}" style="transform-origin:${x+37}px 150px;animation:rise .9s both"/>`}).join("")+`<text x="${x+37}" y="170" text-anchor="middle" font-size="12" font-family="Manrope" font-weight="700" fill="var(--mu)">${lab}</text>`};return `<svg viewBox="0 0 260 178" width="100%" role="img" aria-label="Spending by bucket per cutoff">${col(a,28,"1st cutoff")}${col(b,150,"2nd cutoff")}</svg>`}
function bars(){const mx=11200;return WN.map((w,i)=>`<div style="margin:12px 0"><div class="row" style="border:0;min-height:28px"><span><span class="dt" style="--c:${C(i)}"></span>${w}</span><span class="num">${f(ws(i))}</span></div><div class="pr" style="height:12px"><i style="width:${ws(i)/mx*100}%;background:${C(i)}"></i></div></div>`).join("")}
function ring(){const r=40,cir=2*Math.PI*r;return `<svg viewBox="0 0 110 110" width="120" height="120" role="img" aria-label="11 days until 13th month"><circle cx="55" cy="55" r="${r}" fill="none" stroke="var(--soft)" stroke-width="12"/><circle cx="55" cy="55" r="${r}" fill="none" stroke="var(--ac)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${cir*.64} ${cir}" transform="rotate(-90 55 55)" style="animation:fadein 1s both"/><text x="55" y="58" text-anchor="middle" font-family="Plus Jakarta Sans" font-weight="800" font-size="26" fill="var(--ink)">11</text><text x="55" y="75" text-anchor="middle" font-family="Manrope" font-weight="600" font-size="11" fill="var(--mu)">days</text></svg>`}
const css=document.createElement("style");css.textContent="@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes rise{from{transform:scaleY(0)}}@keyframes fadein{from{opacity:0}}";document.head.append(css);
const head=(t,s)=>`<div class="head"><div><span class="lab">First cutoff · Dec 1 to 15</span><h1 style="margin-top:6px">${t}</h1>${s?`<p class="sub">${s}</p>`:""}</div><button class="btn gh">Dec 2026 plan ▾</button></div>`;
const legB=`<div style="display:flex;gap:14px;flex-wrap:wrap">${[["Essentials","var(--bu1)"],["Wants","var(--bu2)"],["Savings","var(--bu3)"]].map(b=>`<span class="lab"><span class="dt" style="--c:${b[1]}"></span>${b[0]}</span>`).join("")}</div>`;
const L={
1:()=>`<div class="app">${rail}<div class="main">${head("Good evening.","7 transfers left this cutoff. You are on track.")}<section class="hero" style="margin-bottom:18px"><div style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap"><div style="flex:1;min-width:240px"><span class="lab">Left to send</span><div class="bal"><small>₱</small>19,050.00</div><div class="pr" style="background:rgba(255,255,255,.18);max-width:380px"><i style="width:19%"></i></div><div style="display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap"><span class="pill">₱4,400 sent</span><button class="btn" data-cf>Mark all sent</button></div></div>${mascot()}</div></section>
<div class="g2"><section class="card"><div class="head" style="margin:0 0 4px"><h2 style="margin:0">Emergency fund forecast</h2><span class="pill">Cap in Jun 2027</span></div>${area()}</section><section class="card"><h2>Spend by cutoff</h2>${stacked()}${legB}</section></div>
<section class="card mt"><div class="head" style="margin:0 0 6px"><h2 style="margin:0">Pending transfers</h2><span class="lab">7 to go</span></div>${tx(4)}</section></div></div>${mnav}`,
2:()=>`<div class="app">${rail}<div class="main"><section class="hero" style="margin-bottom:18px;padding:32px"><div style="display:flex;justify-content:space-between;gap:18px;align-items:center;flex-wrap:wrap"><div style="max-width:540px"><span class="lab">First cutoff · Dec 1 to 15</span><h1 style="margin:10px 0 8px;font-size:34px">₱19,050 still to send.<br>Nice pace so far.</h1><p class="sub">2 of 9 transfers done. Next: Contingency to Gcash.</p><div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap"><button class="btn" data-cf>Mark next sent</button><button class="btn glass">Open checklist</button></div></div>${mascot("--ms:150px")}</div></section>
