<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bad(yet) · Direction C · Side A / Side B</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Patrick+Hand&family=Red+Hat+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--desk:#E3E8F1;--paper:#FDFDFB;--ink:#1A2F8A;--text:#1B1F2E;--muted:#555C70;--rule:#C3D2EE;--red:#D6322B;--on-red:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--desk:#0D1020;--paper:#161A2D;--ink:#A7BAFF;--text:#E8EBF5;--muted:#A3A9BD;--rule:#2B3459;--red:#FF6B5E;--on-red:#1A0A08}}
:root[data-theme=dark]{--desk:#0D1020;--paper:#161A2D;--ink:#A7BAFF;--text:#E8EBF5;--muted:#A3A9BD;--rule:#2B3459;--red:#FF6B5E;--on-red:#1A0A08}
*{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--text);font:16px/1.45 "Hanken Grotesk",system-ui,sans-serif}
.hand{font-family:"Patrick Hand","Hanken Grotesk",cursive}
.num{font-family:"Red Hat Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:.93em}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
::selection{background:var(--ink);color:var(--paper)}
header.top{background:var(--paper);border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:28px;padding:0 28px;min-height:60px;flex-wrap:wrap}
header.top .logo{font-size:28px;color:var(--ink);padding:6px 0}
header.top nav{display:flex;gap:2px;flex:1;overflow-x:auto}
header.top nav a{padding:19px 12px 16px;color:var(--muted);text-decoration:none;white-space:nowrap;border-bottom:3px solid transparent}
header.top nav a:hover{color:var(--text)}
header.top nav a[aria-current]{color:var(--ink);font-weight:700;border-bottom-color:var(--red)}
.btn{font:inherit;min-height:38px;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 14px;cursor:pointer}
.btn.pri{background:var(--ink);color:var(--paper);font-weight:600}
main{max-width:1180px;margin:0 auto;padding:26px 28px 80px}
.intro{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:end;margin-bottom:20px}
h1{font-size:40px;line-height:1.05;margin:0;color:var(--ink);font-weight:400}
.sub{margin:4px 0 0;color:var(--muted)}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
.side{background:var(--paper);border-radius:6px;box-shadow:0 1px 2px rgba(20,30,70,.18),0 8px 24px rgba(20,30,70,.10);overflow:hidden}
.side .band{background:var(--red);color:var(--on-red);display:flex;justify-content:space-between;align-items:center;padding:6px 18px;font-weight:600;font-size:13px}
.side .band .num{font-weight:500}
.side h2{font-size:32px;color:var(--ink);margin:12px 18px 0;font-weight:400;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.side h2 small{font-size:16px;color:var(--muted)}
.trk{list-style:none;margin:10px 0 0;padding:0}
.trk label{display:grid;grid-template-columns:26px 22px 1fr auto auto;gap:10px;align-items:center;padding:0 18px;min-height:46px;border-top:1px solid var(--rule);cursor:pointer}
.trk .n{color:var(--muted);font-size:13px;text-align:right}
.trk input{width:20px;height:20px;margin:0;accent-color:var(--ink)}
.trk .t{font-size:20px;color:var(--ink);line-height:1.1}
.trk .done .t{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted)}
.chip{font-size:12px;border:1px solid var(--rule);border-radius:999px;padding:1px 9px;color:var(--muted);white-space:nowrap}
.tape{padding:14px 18px 8px;border-top:2px solid var(--ink);margin-top:-1px}
.bar{display:flex;gap:2px;height:12px;border-radius:3px;overflow:hidden;background:var(--rule)}
.bar i{display:block;background:var(--ink)}
.bar i.d{background:var(--muted)}
.tapeinfo{display:flex;justify-content:space-between;gap:10px;margin:8px 0 6px;font-size:14px;flex-wrap:wrap}
.full{color:var(--ink);font-weight:700}
.add{display:block;width:calc(100% - 36px);margin:4px 18px 16px;text-align:left}
.mseg{display:none}
.mnav{display:none}
@media (max-width:900px){
 header.top{padding:0 16px;gap:8px}header.top nav{display:none}
 main{padding:16px 16px 100px}h1{font-size:32px}
 .sides{grid-template-columns:1fr}
 .mseg{display:flex;gap:6px;margin-bottom:16px}.mseg .btn{flex:1;min-height:44px;font-size:18px}
 .mseg .btn[aria-pressed=true]{background:var(--ink);color:var(--paper)}
 .side.hide{display:none}
 .trk label{grid-template-columns:22px 1fr auto;row-gap:0}.trk .n{display:none}.trk .chip{grid-column:2;grid-row:2;justify-self:start;margin-bottom:6px;min-height:0}.trk label{padding-top:6px}.trk .t{grid-column:2}.trk input{grid-row:1/3}.trk .num{grid-column:3;grid-row:1}
 .mnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--rule);z-index:5}
 .mnav a{padding:14px 2px;text-align:center;font-size:13px;color:var(--muted);text-decoration:none;min-height:50px}
 .mnav a[aria-current]{color:var(--ink);font-weight:700;box-shadow:inset 0 3px 0 var(--red)}
}
</style></head><body>
<header class="top"><span class="logo hand">Bad(yet)</span>
<nav aria-label="Main"><a href="#" aria-current="page">Cutoffs</a><a href="#">Pay</a><a href="#">Budget</a><a href="#">Installments</a><a href="#">Subscriptions</a><a href="#">Bonuses</a><a href="#">Savings forecast</a><a href="#">Plans</a></nav>
<button class="btn" id="theme">Theme</button></header>
<main>
<div class="intro"><div><h1 class="hand">December mixtape</h1><p class="sub">Plan: December 2026 (active). Fill each side exactly to your take-home, no overflow.</p></div></div>
<div class="mseg" role="group" aria-label="Side"><button class="btn hand" id="mA" aria-pressed="true">Side A</button><button class="btn hand" id="mB" aria-pressed="false">Side B</button></div>
<div class="sides" id="sides"></div>
</main>
<nav class="mnav" aria-label="Main"><a href="#" aria-current="page">Cutoffs</a><a href="#">Pay</a><a href="#">Budget</a><a href="#">Savings</a><a href="#">More</a></nav>
<script>
const D=[{k:"A",name:"Side A",when:"1st cutoff · Dec 1 to 15",net:23450,L:[["Transpo","Essentials","Gcash",2400,1],["Food","Essentials","Gcash",2000,1],["Contingency","Essentials","Gcash",550],["Rent share","Essentials","BPI",3000],["Internet","Essentials","Maya",1299],["Installments","Essentials","BPI",3000],["Wants","Wants","BPI",5200],["Emergency fund","Savings","Maya",4000],["Travel fund","Savings","Vybe",2001]]},
{k:"B",name:"Side B",when:"2nd cutoff · Dec 16 to 31",net:24100,L:[["Transpo","Essentials","Gcash",2400],["Food","Essentials","Gcash",2000],["Contingency","Essentials","Gcash",550],["Utilities","Essentials","Maya",2600],["Installments","Essentials","BPI",3000],["Wants","Wants","BPI",5500],["Emergency fund","Savings","Maya",4000],["Travel fund","Savings","Vybe",4050]]}];
const f=n=>n.toLocaleString("en-PH",{minimumFractionDigits:2}),m=n=>"₱"+f(n);let show=0;
function draw(){sides.innerHTML=D.map((s,si)=>{const tot=s.L.reduce((a,l)=>a+l[3],0),sent=s.L.reduce((a,l)=>a+(l[4]?l[3]:0),0),left=s.net-tot;
return `<section class="side${si==show?"":" hide"}" data-s="${si}" aria-label="${s.name}"><div class="band"><span>${s.when}</span><span class="num">take-home ${m(s.net)}</span></div>
<h2 class="hand">${s.name}<small>${m(s.net-sent)} still to send</small></h2>
<ol class="trk">${s.L.map((l,i)=>`<li><label class="${l[4]?"done":""}"><span class="n num">${i+1}</span><input type="checkbox" data-s="${si}" data-i="${i}" ${l[4]?"checked":""}><span class="t hand">${l[0]}</span><span class="chip">${l[2]}</span><span class="num">${f(l[3])}</span></label></li>`).join("")}</ol>
<div class="tape"><div class="bar" aria-hidden="true">${s.L.map(l=>`<i class="${l[4]?"d":""}" style="flex:${l[3]}"></i>`).join("")}${left>0?`<i style="flex:${left};background:transparent"></i>`:""}</div>
<div class="tapeinfo"><span>${m(tot)} of ${m(s.net)} allocated</span><span class="${left==0?"full":""}">${left==0?"Side is full. Nice.":"Blank tape: "+m(left)}</span></div></div>
<button class="btn add hand" style="font-size:18px">+ Add a track</button></section>`}).join("");
mA.setAttribute("aria-pressed",show==0);mB.setAttribute("aria-pressed",show==1)}
sides.addEventListener("change",e=>{const l=D[e.target.dataset.s].L[e.target.dataset.i];l[4]=e.target.checked?1:0;draw()});
mA.onclick=()=>{show=0;draw()};mB.onclick=()=>{show=1;draw()};
theme.onclick=()=>{const r=document.documentElement;r.dataset.theme=getComputedStyle(r).getPropertyValue("--desk").trim()=="#0D1020"?"light":"dark"};
draw();
</script></body></html>
