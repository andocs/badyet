<style>
:root{--g-bg:#0C1118;--g-ink:#F1F2F5;--g-mu:#A5AAB5;--g-ln:#28323F}
*{box-sizing:border-box}
body{margin:0;background:var(--g-bg);color:var(--g-ink);font:15px/1.4 system-ui,sans-serif;display:flex;flex-direction:column;height:100vh}
.bar{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--g-ln);flex-wrap:wrap}
.bar b{font-size:16px}.bar p{margin:0;color:var(--g-mu);flex:1;min-width:200px}
.bar button{font:inherit;color:var(--g-ink);background:#1B2430;border:1px solid var(--g-ln);border-radius:8px;padding:7px 14px;min-height:38px;cursor:pointer}
.bar button[aria-pressed=true]{background:var(--g-ink);color:var(--g-bg)}
.dots{display:flex;gap:6px}.dots button{padding:0 10px;min-width:38px}
.wrap{flex:1;overflow:auto;display:flex;justify-content:center;padding:18px;background:#070B10}
.frame{width:100%;max-width:1280px;border-radius:14px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.5);align-self:flex-start;min-height:calc(100vh - 150px);transition:max-width .25s;position:relative}
.frame.phone{max-width:390px}
/* ===== design scope ===== */
.d{background:var(--bg);color:var(--ink);font:500 15px/1.45 var(--fb);container-type:inline-size;min-height:inherit;position:relative;overflow:hidden}
.d *{box-sizing:border-box}
.d h1,.d h2,.d .disp{font-family:var(--fh);font-weight:800;letter-spacing:-.025em}
.d h1{font-size:30px;line-height:1.12;margin:0}.d h2{font-size:18px;margin:0 0 12px}
.d .lab{font-size:13px;font-weight:600;color:var(--mu)}
.d .num{font-variant-numeric:tabular-nums;font-weight:700;font-family:var(--fb)}
.d .sub{color:var(--mu);margin:4px 0 0}
.d .card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:20px;box-shadow:var(--sh)}
.d .btn{font:700 14px var(--fh);background:var(--ac);color:var(--oa);border:0;border-radius:999px;padding:10px 20px;min-height:42px;cursor:pointer;transition:transform .14s cubic-bezier(.16,1,.3,1),filter .14s}
.d .btn:hover{filter:brightness(1.06);transform:translateY(-1px)}.d .btn:active{transform:scale(.97)}
.d .gh{background:var(--soft);color:var(--ink)}.d .glass{background:rgba(255,255,255,.14);color:#fff}

.d .pill.w{background:var(--soft);color:var(--mu)}
.d .app{display:grid;grid-template-columns:208px 1fr;min-height:inherit}
.d .rail{background:var(--rl);color:var(--rli);padding:22px 12px;border-right:1px solid var(--ln)}
.d .rail b{display:flex;align-items:center;gap:9px;font:800 20px var(--fh);padding:0 10px 18px;letter-spacing:-.02em}
.d .rail b i{width:26px;height:26px;border-radius:9px;background:linear-gradient(135deg,var(--ac),var(--b2));display:block}
.d .rail a{display:block;padding:10px 12px;border-radius:12px;color:inherit;opacity:.78;text-decoration:none;margin-bottom:2px;font-weight:600}
.d .rail a:hover{opacity:1;background:var(--soft)}.d .rail a.on{background:var(--tint);color:var(--act);opacity:1;font-weight:700}
.d .main{padding:24px 28px 50px}
.d .head{display:flex;justify-content:space-between;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:20px}
.d .g2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:18px;align-items:start}
.d .g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.d .g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.d .stack{display:grid;gap:18px}.d .mt{margin-top:18px}
.d .pr{height:10px;background:var(--soft);border-radius:999px;overflow:hidden}.d .pr i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--ac),var(--b2));animation:grow 1s cubic-bezier(.16,1,.3,1) both}

.d .dt{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:8px}

.d .hero{background:var(--hg);color:#fff;border-radius:var(--hr);padding:28px;position:relative;overflow:hidden;border:0}
.d .hero::before{content:"";position:absolute;right:-70px;top:-90px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,var(--gl),transparent 65%)}
.d .hero>*{position:relative}.d .hero .lab,.d .hero .sub{color:#B9D4E8}
.d .bal{font:800 52px/1.05 var(--fh);letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:8px 0 12px;animation:rise2 .7s cubic-bezier(.16,1,.3,1) both}.d .bal small{font-size:.5em;opacity:.8;margin-right:4px}

.d .hero .pill{background:rgba(255,255,255,.16);color:#fff}

.d .tx .nm{font-weight:700}.d .tx .r{text-align:right}.d .tx .r div{font-size:16px}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}

.d .wc{border-radius:calc(var(--r)*.9);padding:16px;color:#fff;background:linear-gradient(135deg,var(--k),color-mix(in srgb,var(--k) 55%,#000));position:relative;min-height:128px;display:flex;flex-direction:column;justify-content:space-between;animation:pop .5s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i)*70ms)}
.d .wc::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.12)}
.d .wc .chip{width:30px;height:22px;border-radius:6px;background:linear-gradient(135deg,#F6D98B,#D9A73F)}
.d .wc .a{font:800 21px var(--fh);letter-spacing:-.02em;font-variant-numeric:tabular-nums}.d .wc small{opacity:.85}
.d .cf{position:absolute;width:9px;height:14px;border-radius:2px;pointer-events:none;animation:fall 1.2s ease-out forwards;z-index:30}
@keyframes fall{to{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}
.d .mnav{display:none}
@media (prefers-reduced-motion:reduce){.d *{animation:none!important}}
@container (max-width:760px){
 .d .app{grid-template-columns:1fr}.d .rail{display:none}.d .main{padding:16px 14px 90px}.d h1{font-size:25px}

.d .tn{display:flex;align-items:center;gap:18px;padding:14px 28px;background:var(--rl);border-bottom:1px solid var(--ln);flex-wrap:wrap}.d .tn b{display:flex;align-items:center;gap:9px;font:800 20px var(--fh);letter-spacing:-.02em}.d .tn b i{width:26px;height:26px;border-radius:9px;background:linear-gradient(135deg,var(--ac),var(--b2));display:block}
.d .tn nav{display:flex;gap:4px;flex:1;overflow:auto}.d .tn a{padding:8px 13px;border-radius:999px;color:var(--mu);text-decoration:none;font-weight:600;white-space:nowrap}.d .tn a.on{background:var(--tint);color:var(--act);font-weight:700}
.d .av2{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--b2));display:grid;place-items:center;color:var(--oa);font:800 14px var(--fh)}
@container (max-width:760px){.d .span2,.d .span3{grid-column:auto}.d .tn nav{display:none}.d .tn{padding:12px 14px}.d .strip .wc{min-width:170px}}

function stacked(){const a=[[12249,"var(--bu1)"],[5200,"var(--bu2)"],[6001,"var(--bu3)"]],b=[[10550,"var(--bu1)"],[5500,"var(--bu2)"],[8050,"var(--bu3)"]];const col=(L,x,lab)=>{let y=150;return L.map(p=>{const h=p[0]/24100*130;y-=h;return `<rect x="${x}" y="${y}" width="74" height="${h-2}" rx="9" fill="${p[1]}" style="transform-origin:${x+37}px 150px;animation:rise .9s both"/>`}).join("")+`<text x="${x+37}" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="var(--mu)">${lab}</text>`};return `<svg viewBox="0 0 260 178" width="100%" role="img" aria-label="Spending by bucket per cutoff">${col(a,28,"1st cutoff")}${col(b,150,"2nd cutoff")}</svg>`}
function bars(){const mx=11200;return WN.map((w,i)=>`<div style="margin:12px 0"><div class="row" style="border:0;min-height:28px"><span><span class="dt" style="--c:${C(i)}"></span>${w}</span><span class="num">${f(ws(i))}</span></div><div class="pr" style="height:12px"><i style="width:${ws(i)/mx*100}%;background:${C(i)}"></i></div></div>`).join("")}
function ring(){const r=40,cir=2*Math.PI*r;return `<svg viewBox="0 0 110 110" width="120" height="120" role="img" aria-label="11 days until 13th month"><circle cx="55" cy="55" r="${r}" fill="none" stroke="var(--soft)" stroke-width="12"/><circle cx="55" cy="55" r="${r}" fill="none" stroke="var(--ac)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${cir*.64} ${cir}" transform="rotate(-90 55 55)" style="animation:fadein 1s both"/><text x="55" y="58" text-anchor="middle" class="fh" font-weight="800" font-size="26" fill="var(--ink)">11</text><text x="55" y="75" text-anchor="middle" font-weight="600" font-size="11" fill="var(--mu)">days</text></svg>`}
const css=document.createElement("style");css.textContent="@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes rise{from{transform:scaleY(0)}}@keyframes fadein{from{opacity:0}}";document.head.append(css);
const head=(t,s)=>`<div class="head"><div><span class="lab">First cutoff · Dec 1 to 15</span><h1 style="margin-top:6px">${t}</h1>${s?`<p class="sub">${s}</p>`:""}</div><button class="btn gh">Dec 2026 plan ▾</button></div>`;
const legB=`<div style="display:flex;gap:14px;flex-wrap:wrap">${[["Essentials","var(--bu1)"],["Wants","var(--bu2)"],["Savings","var(--bu3)"]].map(b=>`<span class="lab"><span class="dt" style="--c:${b[1]}"></span>${b[0]}</span>`).join("")}</div>`;
const wcs=(cls)=>`<div class="${cls||"g4"}">${WN.map((w,i)=>`<div class="wc" style="--k:var(--k${i+1});--i:${i}"><div style="display:flex;justify-content:space-between;align-items:center"><b>${w}</b><span class="chip"></span></div><div><div class="a">₱${f(ws(i))}</div><small>${i==0?"2 of 3 sent":"0 sent"}</small></div></div>`).join("")}</div>`;
const strip=()=>`<div class="strip">${WN.map((w,i)=>`<div class="wc" style="--k:var(--k${i+1});--i:${i}"><div style="display:flex;justify-content:space-between;align-items:center"><b>${w}</b><span class="chip"></span></div><div><div class="a">₱${f(ws(i))}</div><small>${i==0?"2 of 3 sent":"0 sent"}</small></div></div>`).join("")}</div>`;
const ringCard=()=>`<section class="card"><h2>13th month</h2><div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">${ring()}<div><div class="disp" style="font-size:22px">+₱24,000</div><p class="sub">Estimate · lands Dec 15</p></div></div><div class="mt"><div class="row"><span>Allocation items</span><span class="pill w">3 waiting</span></div></div></section>`;
const fcCard=()=>`<section class="card"><div class="head" style="margin:0 0 4px"><h2 style="margin:0">Emergency fund forecast</h2><span class="pill">Cap in Jun 2027</span></div>${area()}</section>`;
const cutCard=()=>`<section class="card"><h2>Spend by cutoff</h2>${stacked()}${legB}</section>`;
const txCard=()=>`<section class="card"><div class="head" style="margin:0 0 6px"><h2 style="margin:0">Pending transfers</h2><span class="lab">7 to go</span></div>${tx(4)}</section>`;
const hero=(extra)=>`<section class="hero" style="margin-bottom:18px"><div style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap"><div style="flex:1;min-width:240px"><span class="lab">Left to send</span><div class="bal"><small>₱</small>19,050.00</div><div class="pr" style="background:rgba(255,255,255,.18);max-width:380px"><i style="width:19%"></i></div><div style="display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap"><span class="pill">₱4,400 sent</span><button class="btn" data-cf>Mark all sent</button></div></div>${extra||mascot()}</div></section>`;
const topbar=()=>`<div class="tn"><b><i></i>Bad(yet)</b><nav>${nav.map((x,i)=>`<a href="#" class="${i?"":"on"}">${x}</a>`).join("")}</nav><span class="av2">U</span></div>`;
const L={
A:()=>`<div class="app">${rail}<div class="main">${head("Good evening.","7 transfers left this cutoff. You are on track.")}${hero()}${wcs()}<div class="g2 mt"><div class="stack">${fcCard()}${txCard()}</div><div class="stack">${ringCard()}${cutCard()}</div></div></div></div>${mnav}`,
B:()=>`<div class="app">${rail}<div class="main">${head("Good evening.","7 transfers left this cutoff. You are on track.")}<div class="g2"><div class="stack"><div>${hero()}</div>${wcs("g4\" style=\"grid-template-columns:repeat(2,minmax(0,1fr))")}</div><div class="stack">${ringCard()}${cutCard()}</div></div><div class="g2 mt">${fcCard()}${txCard()}</div></div></div>${mnav}`,
C:()=>`<div class="app">${rail}<div class="main">${head("Good evening.","7 transfers left this cutoff. You are on track.")}${hero()}${strip()}<div class="g2"><section class="card"><div class="head" style="margin:0 0 6px"><h2 style="margin:0">Pending transfers</h2><span class="lab">7 to go</span></div>${tx(6)}</section><div class="stack">${fcCard()}${ringCard()}</div></div></div></div>${mnav}`,
D:()=>`<div class="app">${rail}<div class="main">${head("Good evening.","7 transfers left this cutoff. You are on track.")}<div class="g4" style="align-items:stretch"><div class="span3">${hero().replace('margin-bottom:18px','margin-bottom:0;height:100%')}</div>${ringCard()}</div><div class="mt">${wcs()}</div><div class="g4 mt"><div class="span2">${fcCard()}</div><div class="span2">${cutCard()}</div></div><div class="mt">${txCard()}</div></div></div>${mnav}`,
E:()=>`${topbar()}<div class="main" style="max-width:1160px;margin:auto">${head("Good evening.","7 transfers left this cutoff. You are on track.")}<div class="g2" style="align-items:stretch"><div>${hero().replace('margin-bottom:18px','margin-bottom:0;height:100%')}</div>${ringCard()}</div><div class="mt">${wcs()}</div><div class="g2 mt">${fcCard()}${txCard()}</div></div>${mnav}`};
let i=0;const fr=document.getElementById("frame");
function show(n){i=(n+DES.length)%DES.length;const d=DES[i];fr.innerHTML=`<div class="d" style="${T(d.t)}">${L[d.l]()}</div>`;desc.innerHTML=`<b>${i+1}/${DES.length} · ${d.n}</b> · ${d.d}`;[...dots.children].forEach((b,j)=>b.setAttribute("aria-pressed",j==i))}
DES.forEach((d,j)=>{const b=document.createElement("button");b.textContent=j+1;b.title=d.n;b.onclick=()=>show(j);dots.append(b)});

fr.addEventListener("click",e=>{const b=e.target.closest("[data-cf]");if(!b)return;const d=fr.querySelector(".d"),r=b.getBoundingClientRect(),q=d.getBoundingClientRect();d.classList.add("hp");
const cols=["#F6C453","#34D399","#7FA8FF","#FF8A8A","#C4A0FF"];for(let k=0;k<44;k++){const s=document.createElement("span");s.className="cf";s.style.cssText=`left:${r.left-q.left+r.width/2}px;top:${r.top-q.top}px;background:${cols[k%5]};--dx:${(Math.random()-.5)*420}px;--dy:${Math.random()*260-60}px`;d.append(s);setTimeout(()=>s.remove(),1300)}});
prev.onclick=()=>show(i-1);nxt.onclick=()=>show(i+1);
dk.onclick=()=>{fr.classList.remove("phone");dk.setAttribute("aria-pressed",true);ph.setAttribute("aria-pressed",false)};
ph.onclick=()=>{fr.classList.add("phone");ph.setAttribute("aria-pressed",true);dk.setAttribute("aria-pressed",false)};
addEventListener("keydown",e=>{if(e.key=="ArrowRight")show(i+1);if(e.key=="ArrowLeft")show(i-1)});
show(0);
</script></body></html>
