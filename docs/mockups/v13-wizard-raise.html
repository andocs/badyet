<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wizard · Raise or promotion</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@500;600;700&family=Gabarito:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="v13-shared.css"><script src="v13-data.js"></script><script src="v13-shared.js"></script><script src="v13-wiz.js"></script>
<style>.slip table.cmp td,.slip table.cmp th{padding:6px 10px}.slip table.cmp td:first-child,.slip table.cmp th:first-child{padding-left:18px}.slip table.cmp td:last-child,.slip table.cmp th:last-child{padding-right:18px}.cmp tr.tot td{font-weight:800;border-top:1px solid var(--line)}</style>
</head><body data-nav="salary" data-shell="none">
<main id="app"></main>
<script>
const P=BY.peso,B=BY.SCENARIOS.base;
const S={kind:'merit',mode:'pct',pct:3.5,newBase:80000,month:'2028-09',title:'Lead Analyst',grade:'Grade 8',amt:1000,freq:'month',tax:false,adj:5000,adjTax:true,saved:false,status:'confirmed',al:[],ovr:{sss:'',ph:'',pi:''},apct:4,amon:3};
if(location.hash==='#assumptions')S.kind='none';
const KINDS=[['merit','Merit raise','A percent or a new amount on your base'],['promo','Promotion','New base, maybe a new title and grade'],['allow','Allowance change','A new monthly or yearly allowance'],['adj','One-off adjustment','A single payment, like a back-pay']];
const prevYm=ym=>{let y=+ym.slice(0,4),m=+ym.slice(5)-1;if(!m){m=12;y--}return y+'-'+String(m).padStart(2,'0')};
function mopts(){return BY.months.map(m=>`<option value="${m}" ${m===S.month?'selected':''}>${BY.ymLabel(m)}</option>`).join('')}
function ps(base,allowUntaxed,taxable){const c0=BY.contrib(base),O=(k,v)=>S.ovr[k]!==''&&!isNaN(+S.ovr[k])?+S.ovr[k]:v,c={sss:O('sss',c0.sss),ph:O('ph',c0.ph),pi:O('pi',c0.pi)};c.total=c.sss+c.ph+c.pi;const annual=12*(base-c.total+taxable),tax=BY.annualTax(annual)/12;return {base,allowUntaxed,taxable,c,tax,take:base+allowUntaxed+taxable-c.total-tax,annual}}
function calc(){
 const cur=BY.salaryAt(S.month,B),b0=ps(cur.base,cur.allow,0);let b1=b0,yearly=0,one=null;
 if(S.kind==='merit'){const nb=S.mode==='pct'?Math.round(cur.base*(1+S.pct/100)):S.newBase;b1=ps(nb,cur.allow,0)}
 if(S.kind==='promo')b1=ps(S.newBase,cur.allow,0);
 if(S.kind==='allow'){if(S.freq==='month')b1=S.tax?ps(cur.base,cur.allow,S.amt):ps(cur.base,cur.allow+S.amt,0);else yearly=S.amt}
 if(S.kind==='adj'){const a=b0.annual,r=BY.BRACKETS.find(([lo,hi])=>a>lo&&a<=hi);const rate=S.adjTax&&r?r[2]:0;one={gross:S.adj,tax:S.adj*rate,rate,net:S.adj*(1-rate)}}
 const dm=(b1.take-b0.take)/2;
 /* months left in the five-year window, Dec 2026 to Nov 2031 */
 const left=BY.months.length-BY.months.indexOf(S.month);
 const decs=BY.months.slice(BY.months.indexOf(S.month)).filter(m=>m.endsWith('-12')).length;
 const th13=(S.kind==='merit'||S.kind==='promo')?(b1.base-b0.base)*decs:0;
 const five=S.kind==='adj'?one.net:S.kind==='allow'&&S.freq==='year'?yearly*Math.ceil(left/12):(b1.take-b0.take)*left;
 return {cur,b0,b1,dm,yearly,one,left,th13,five};
}
const dif=(a,b,inv)=>{const d=b-a;return Math.abs(d)<.005?'<span class="dif">same</span>':`<span class="dif ${(d>0)!==!!inv?'up':'dn'}">${P(d,{sign:1})}</span>`};
function slip(S,i){
 const c=calc(),{b0,b1}=c;
 if(S.kind==='adj'){const o=c.one;return `<div class="slip"><div class="hd"><div><div class="lbl">One-off payslip</div><div class="disp" style="font-size:22px">${BY.ymLabel(S.month)}</div></div></div><div class="sec"><h3>Earnings</h3><div class="ln"><span>Adjustment</span><span class="num">${P(o.gross)}</span></div><h3>Tax</h3><div class="ln"><span>Withheld at ${o.rate*100}%<span class="m">${S.adjTax?'your top bracket this year':'marked as not taxed'}</span></span><span class="num">−${P(o.tax)}</span></div></div><div class="net"><div><div class="lbl" style="color:var(--accent-text)">You receive</div><div class="xs muted">Once. Later cutoffs do not change.</div></div><b class="n num">${P(o.net)}</b></div></div>`}
 const rows=[['Base pay',b0.base,b1.base],['Allowances',b0.allowUntaxed,b1.allowUntaxed],['Taxed allowance',0,b1.taxable],[S.ovr.sss!==''?'SSS (yours)':'SSS',-b0.c.sss,-b1.c.sss],[S.ovr.ph!==''?'PhilHealth (yours)':'PhilHealth',-b0.c.ph,-b1.c.ph],[S.ovr.pi!==''?'Pag-IBIG (yours)':'Pag-IBIG',-b0.c.pi,-b1.c.pi],['Income tax',-b0.tax,-b1.tax]].filter(r=>Math.abs(r[1])+Math.abs(r[2])>0);
 return `<div class="slip"><div class="hd"><div><div class="lbl">Payslip, before and after</div><div class="disp" style="font-size:22px">From ${BY.ymLabel(S.month)}</div></div><div style="text-align:right"><div class="lbl">Per cutoff</div><div class="num" style="font:800 20px Gabarito">${dif(b0.take/2,b1.take/2)}</div></div></div>
 <div class="scrollx"><table class="cmp"><thead><tr><th>Per month</th><th>Before</th><th>After</th><th>Change</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r[0]}</td><td class="num">${P(r[1])}</td><td class="num">${P(r[2])}</td><td class="num">${dif(r[1],r[2])}</td></tr>`).join('')}<tr class="tot"><td>Take-home</td><td class="num">${P(b0.take)}</td><td class="num">${P(b1.take)}</td><td class="num">${dif(b0.take,b1.take)}</td></tr></tbody></table></div>
 <div class="net"><div><div class="lbl" style="color:var(--accent-text)">Per cutoff, after</div><div class="xs muted">${S.kind==='allow'&&S.freq==='year'?'Paid once a year, so cutoffs do not change.':'Twice a month, from '+BY.ymLabel(S.month)}</div></div><b class="n num">${P(b1.take/2)}</b></div></div>
 ${i>=1&&S.kind!=='none'?`<div class="card" style="margin-top:12px"><div class="lbl">Over the next five years</div><div class="big num pos" style="font-size:30px">${P(c.five,{sign:1})}</div><div class="sm muted">more take-home, about. ${c.th13?`Plus ${P(c.th13,{sign:1})} on 13th-month pay, and CIP follows. `:''}${S.al&&S.al.length?(()=>{const ex=Math.max(0,c.b1.take-c.b0.take),sum=S.al.reduce((t,r)=>t+(r.mode==='pct'?ex*r.v/100:r.v),0);return `You placed ${P(sum)} of the extra on budget lines (they keep growing with take-home too). ${P(ex-sum)} lands in Whatever is left and goes to savings.`})():'Of each extra peso, 39% follows your percent lines and the rest lands in Whatever is left, so your savings pool grows with it.'}</div></div>`:''}`;
}
const steps=[
 {label:'What happened',title:'What changed at work?',sub:'Pick the closest one. You can add more events later.',
  body:S=>`<div class="choice" role="radiogroup" aria-label="What happened">${KINDS.map(([v,l,d])=>`<label><input type="radio" name="k" data-k="kind" value="${v}" ${S.kind===v?'checked':''}>${l}<small>${d}</small></label>`).join('')}</div>
   <div style="margin-top:20px"><div class="lbl" style="margin-bottom:6px">How sure is it?</div><div class="seg" role="group" aria-label="How sure is it"><button data-st="confirmed" aria-pressed="${S.status==='confirmed'}">It has happened</button><button data-st="expected" aria-pressed="${S.status==='expected'}">I'm expecting it</button></div><p class="xs muted" style="margin:8px 0 0">Expected raises are drawn as hollow markers and feed the forecast, so you can plan ahead. Turn one into a confirmed event when it happens.</p></div>`,
  bind:(r,S,api)=>{r.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{S.status=b.dataset.st;api.redo();r.querySelector('[data-st="'+S.status+'"]').focus()})}},
 {label:'The numbers',title:'The details',sub:'Watch the payslip on the right change as you type.',ok:S=>S.kind==='none'||(S.kind==='merit'?(S.mode==='pct'?S.pct>0:S.newBase>0):S.kind==='promo'?S.newBase>0:S.kind==='allow'?S.amt>0:S.adj!==0),
  body:S=>{if(S.kind==='none')return '<div class="note"><b>Nothing to enter here.</b> Go on to contributions and assumptions.</div>';const m=`<label class="field">Effective month<select data-k="month">${mopts()}</select></label>`;
   if(S.kind==='merit')return `<div class="frm"><div class="seg" role="group" aria-label="How to enter it"><button data-mode="pct" aria-pressed="${S.mode==='pct'}">A percent</button><button data-mode="amt" aria-pressed="${S.mode==='amt'}">A new base</button></div><div class="two">${S.mode==='pct'?`<label class="field">Raise %<input data-k="pct" data-n inputmode="decimal" value="${S.pct}"></label>`:`<label class="field">New base per month (₱)<input data-k="newBase" data-n inputmode="decimal" value="${S.newBase}"></label>`}${m}</div></div>`;
   if(S.kind==='promo')return `<div class="frm"><div class="two"><label class="field">New base per month (₱)<input data-k="newBase" data-n inputmode="decimal" value="${S.newBase}"></label>${m}</div><div class="two"><label class="field">New title<input data-k="title" value="${S.title}"></label><label class="field">Grade<input data-k="grade" value="${S.grade}"></label></div></div>`;
   if(S.kind==='allow')return `<div class="frm"><div class="two"><label class="field">Amount (₱)<input data-k="amt" data-n inputmode="decimal" value="${S.amt}"></label><label class="field">How often<select data-k="freq"><option value="month" ${S.freq==='month'?'selected':''}>Every month</option><option value="year" ${S.freq==='year'?'selected':''}>Once a year</option></select></label></div><div class="two">${m}<label class="row" style="gap:10px;align-self:end;min-height:44px"><button class="sw" role="switch" aria-checked="${S.tax}" data-sw="tax" aria-label="This allowance is taxable"></button><span>Payroll taxes it</span></label></div></div>`;
   return `<div class="frm"><div class="two"><label class="field">Amount (₱)<input data-k="adj" data-n inputmode="decimal" value="${S.adj}"></label>${m}</div><label class="row" style="gap:10px;min-height:44px"><button class="sw" role="switch" aria-checked="${S.adjTax}" data-sw="adjTax" aria-label="This payment is taxed"></button><span>Payroll taxes it</span></label></div>`},
  bind:(r,S,api)=>{r.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;api.redo();r.querySelector(`[data-mode="${S.mode}"]`).focus()});r.querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>{S[b.dataset.sw]=toggleChk(b);api.slip()})}},
 {label:'The extra',title:'Where does the extra go?',sub:'Optional. Put part of the new take-home on budget lines. Whatever you leave unplaced lands in Whatever is left, so it still gets saved.',skip:1,
  body:S=>{const c=calc(),ex=Math.max(0,c.b1.take-c.b0.take);
   if(S.kind==='adj'||(S.kind==='allow'&&S.freq==='year')||ex<=0)return '<div class="note"><b>Nothing monthly to place.</b> This one does not change your monthly take-home.</div>';
   const amt=r=>r.mode==='pct'?ex*r.v/100:r.v,sum=S.al.reduce((t,r)=>t+amt(r),0),un=ex-sum,used=S.al.map(r=>r.line),av=BY.LINES.filter(l=>l.g!=='sav'&&!l.draft&&l.kind!=='rtoc'&&!used.includes(l.id));
   return '<div class="stack"><div class="card flat row sp" style="padding:0"><span class="muted">New take-home each month</span><b class="num" style="font:800 24px Gabarito">'+P(ex)+'</b></div>'+
    '<div>'+S.al.map((r,i)=>{const l=BY.LINES.find(x=>x.id===r.line);return '<div class="row wrap" style="gap:10px;padding:10px 0;border-bottom:1px solid var(--line)"><span class="grow"><b>'+l.name+'</b><span class="xs muted" style="display:block">from '+BY.ymLabel(S.month)+' onward</span></span><span class="seg" role="group" aria-label="Enter as" style="padding:2px"><button data-am="'+i+'|amt" aria-pressed="'+(r.mode==='amt')+'" style="padding:4px 10px;min-height:32px">₱</button><button data-am="'+i+'|pct" aria-pressed="'+(r.mode==='pct')+'" style="padding:4px 10px;min-height:32px">%</button></span><input class="lbl-in" data-av="'+i+'" value="'+Math.round(r.v*100)/100+'" inputmode="decimal" style="width:100px;text-align:right;min-height:40px" aria-label="'+(r.mode==='pct'?'Percent':'Pesos')+' for '+l.name+'"><span class="num xs muted" style="min-width:84px;text-align:right">'+(r.mode==='pct'?P(amt(r)):'')+'</span><button class="iconbtn s" data-ar="'+i+'" aria-label="Remove '+l.name+'">'+icon('x')+'</button></div>'}).join('')+
    '<div class="row sp" style="padding:12px 0"><b class="'+(un<-0.5?'neg':'')+'">'+(un<-0.5?'Over by':'Left to Whatever is left')+'</b><b class="num '+(un<-0.5?'neg':'pos')+'">'+P(Math.abs(un))+'</b></div></div>'+
    (av.length?'<label class="field"><span class="sr">Add a budget line</span><select data-aa><option value="">Add a budget line…</option>'+av.map(l=>'<option value="'+l.id+'">'+l.name+'</option>').join('')+'</select></label>':'')+
    '<p class="xs muted" style="margin:0">These top-ups stay tied to this raise. If the raise changes or is removed, they change or go with it.</p></div>'},
  bind:(r,S,api)=>{const ex=Math.max(0,calc().b1.take-calc().b0.take),amt=x=>x.mode==='pct'?ex*x.v/100:x.v;
   r.querySelectorAll('[data-av]').forEach(i=>i.onchange=()=>{S.al[+i.dataset.av].v=parseFloat(i.value)||0;api.redo()});
   r.querySelectorAll('[data-ar]').forEach(b=>b.onclick=()=>{S.al.splice(+b.dataset.ar,1);api.redo()});
   r.querySelectorAll('[data-am]').forEach(b=>b.onclick=()=>{const [k,m]=b.dataset.am.split('|'),x=S.al[+k];if(x.mode!==m){const a=amt(x);x.mode=m;x.v=m==='pct'?Math.round(a/ex*10000)/100:Math.round(a*100)/100}api.redo()});
   const a=r.querySelector('[data-aa]');if(a)a.onchange=()=>{if(!a.value)return;const left=Math.max(0,ex-S.al.reduce((t,x)=>t+amt(x),0));S.al.push({line:a.value,mode:'amt',v:Math.round(left)});api.redo()}}},
 {label:'Check the tax',title:'Does the tax look right?',sub:'This is the same working your payslip uses. If your real payslip differs, you can override it later.',
  body:S=>{const c=calc(),a=c.b1;return S.kind==='adj'?`<div class="note"><b>One payment, taxed at your top bracket (${c.one.rate*100}%).</b> That is a simple estimate. Your payroll may withhold differently.</div>`:`<div class="frm"><div class="pre">After this, tax for the year is ${P(BY.annualTax(a.annual))} on ${P(a.annual)} taxable. That is ${P(a.tax)} a month, ${dif(c.b0.tax,a.tax,1)} from before.</div><div class="note"><b>Contributions:</b> SSS ${P(a.c.sss)}, PhilHealth ${P(a.c.ph)}, Pag-IBIG ${P(a.c.pi)} a month. SSS stops growing at a ₱35,000 base.</div></div>`}},
 {label:'Save',title:'Ready to save',sub:'It will appear on Salary and tax, and the budget, bonuses and forecast will follow.',final:true,
  body:S=>{const c=calc(),what={merit:S.mode==='pct'?`Merit raise of ${S.pct}%`:`Merit raise to ${P(S.newBase)}`,promo:`Promotion to ${S.title}, ${P(S.newBase)} a month`,allow:`${P(S.amt)} ${S.freq==='month'?'a month':'once a year'} allowance`,adj:`One-off ${P(S.adj)}`,none:'Assumptions and contributions only'}[S.kind];
   return `<div class="stack"><div class="card flat" style="padding:0"><div class="row sp"><b>${what}</b><span class="pill">${BY.ymLabel(S.month)}</span></div>${S.kind!=='adj'&&S.kind!=='none'?`<div class="sm muted" style="margin-top:6px">${P(c.dm,{sign:1})} per cutoff. 5-year total ${P(c.five,{sign:1})}.</div>`:''}</div><div class="row wrap" style="gap:10px"><button class="btn pri" id="save">Save event</button><button class="btn" id="back">Back</button></div><div id="done" role="status"></div></div>`},
  bind:(r,S,api)=>{r.querySelector('#back').onclick=()=>api.go(3);r.querySelector('#save').onclick=()=>{try{const c=calc(),ex=Math.max(0,c.b1.take-c.b0.take),old=JSON.parse(localStorage.getItem('v13raise')||'[]').filter(x=>x.ev!==S.month);S.al.forEach(x=>old.push({ev:S.month,label:(KINDS.find(k=>k[0]===S.kind)||['',S.kind])[1]+', '+BY.ymLabel(S.month),line:x.line,amt:Math.round((x.mode==='pct'?ex*x.v/100:x.v)*100)/100,status:S.status}));localStorage.setItem('v13raise',JSON.stringify(old))}catch(e){}r.querySelector('#done').innerHTML=`<div class="flag" style="background:var(--tint);color:var(--accent-text)"><span>✓</span><span><b>Saved (mockup).</b> Your five-year total moves by ${P(calc().five,{sign:1})}. <a href="v13-salary.html">See Salary and tax</a> or <a href="v13-forecast.html">the Forecast</a>.</span></div>`}}},
];
Wiz({root:$('#app'),title:'Raise or promotion',steps,S,slip,close:'v13-salary.html'});
</script></body></html>
