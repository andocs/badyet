<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wizard · Plan a bonus</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@500;600;700&family=Gabarito:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="v13-shared.css"><script src="v13-data.js"></script><script src="v13-shared.js"></script><script src="v13-wiz.js"></script>
<style>
.sr-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);min-height:52px}
.sr-row:last-of-type{border-bottom:0}
.sr-row input{font:inherit;font-weight:700;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:6px 8px;width:76px;min-height:40px;text-align:right}
.tkn{display:inline-flex;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--soft);color:var(--muted)}
.mini{height:12px;border-radius:999px;overflow:hidden;display:flex;background:var(--soft);margin:6px 0 4px}.mini i{display:block}
</style></head><body data-nav="bonus" data-shell="none">
<main id="app"></main>
<script>
const P=BY.peso;
const DEST={home:{n:'Home down payment',k:'Fund',c:'var(--gold)'},emg:{n:'Emergency',k:'Fund',c:'var(--accent)'},trv:{n:'Travel',k:'Fund',c:'var(--blue)'},gdg:{n:'Gadget swap',k:'Fund',c:'var(--violet)'},gifts:{n:'Christmas gifts',k:'Gifts',c:'var(--pink)'},big:{n:'Big purchase: new laptop',k:'Big purchase',c:'var(--teal)'},debt:{n:'Extra on a loan',k:'Debt',c:'var(--red)'},treat:{n:'Treat myself',k:'Treat',c:'var(--muted)'}};
const TYPES={'13th':{n:'13th month',rec:'yearly',m:'2027-12',f:'base',desc:'One month of base pay, every December. No de minimis.',dm:0},cip:{n:'CIP',rec:'yearly',m:'2027-03',f:'cip',desc:'Eligible earnings × a percent × a multiplier, every March.',dm:12000},custom:{n:'Another yearly bonus',rec:'yearly',m:'2027-06',f:'fixed',desc:'A fixed amount you get every year.',dm:0},once:{n:'One-off bonus',rec:'once',m:'2027-09',f:'fixed',desc:'Announced once, like a retention or project bonus. Not repeated.',dm:5000}};
const PL_STD={b13th:'first',bcip:'second',bsep:'second',allow:'second',yearly:'second'};
function loadPlace(){try{return {...PL_STD,...JSON.parse(localStorage.getItem('v13place')||'{}')}}catch(e){return {...PL_STD}}}
function savePlace(p){try{localStorage.setItem('v13place',JSON.stringify(p))}catch(e){}}
const S={cut:'first',rows:null,type:/once/.test(location.hash)?'once':'13th',name:'',month:'2027-12',mult:1,comp:10,fixed:15000,dm:0,pcts:{gifts:25,home:45,emg:30},saved:false};
const EK={b13th:'13th',bcip:'cip',bsep:'once'},EM=(location.hash.match(/edit=(\w+)/)||[])[1];
const PK={'13th':'b13th',cip:'bcip',custom:'bcustom',once:'bsep'};
function setType(t){const T=TYPES[t];S.type=t;S.cut=loadPlace()[PK[t]]||(t==='13th'?'first':'second');S.month=T.m;S.dm=T.dm;S.fixed=t==='custom'?10000:15000;S.pcts=t==='13th'?{gifts:25,home:45,emg:30}:t==='cip'?{big:40,home:30,trv:10,emg:20}:t==='once'?{trv:100}:{treat:50,emg:50};S.rows=null}
setType(S.type);if(EM&&EK[EM])setType(EK[EM]);
const sim=BY.simulate('base',BY.OVERRIDES);
function room(){const y=+S.month.slice(0,4);let used=y===2026?62000:0;sim.forEach(r=>{if(r.y===y&&r.ym<S.month&&r.bonus&&r.ym!==S.month)used+=r.bonus.gross-r.bonus.dm});return Math.max(0,BY.CAP-used)}
function calc(){const T=TYPES[S.type],y=+S.month.slice(0,4),sa=BY.salaryAt(S.month,BY.SCENARIOS.base);
 let g=T.f==='base'?sa.base:T.f==='cip'?12*BY.salaryAt((y-1)+'-12',BY.SCENARIOS.base).base*S.comp/100*S.mult:S.fixed;
 const dm=S.type==='13th'?0:Math.min(S.dm,g),ex=g-dm,rm=room(),over=Math.max(0,ex-rm),rate=BY.annualTax((sa.base-BY.contrib(sa.base).total)*12)>102500?.25:.2,tax=over*rate;
 return {g,dm,ex,rm,over,rate,tax,net:g-tax,after:Math.max(0,rm-ex)}}
const mopts=()=>BY.months.map(m=>`<option value="${m}" ${m===S.month?'selected':''}>${BY.ymLabel(m)}</option>`).join('');
const info=r=>r.custom?{n:r.label||'Custom destination',k:'Custom',c:'var(--muted)'}:DEST[r.id];
const amtOf=(r,net)=>r.mode==='pct'?net*r.v/100:r.v;
let cid=0;
function rows(){if(!S.rows){const net=calc().net,e=Object.entries(S.pcts);let used=0;S.rows=e.map(([id,p],i)=>{const v=i===e.length-1?Math.round((net-used)*100)/100:Math.round(net*p)/100;used+=v;return {id,mode:'amt',v}})}return S.rows}
const sumAmt=net=>rows().reduce((a,r)=>a+amtOf(r,net),0);
function slip(S,i){const c=calc(),T=TYPES[S.type];
 const net0=c.net,un=net0-(i>=3?sumAmt(net0):0),split=i>=3?`<div class="sec"><h3>Where it goes</h3><div class="mini" role="img" aria-label="Split">${rows().map(r=>`<i style="width:${Math.max(0,amtOf(r,net0))/net0*100}%;background:${info(r).c}"></i>`).join('')}</div>${rows().map(r=>`<div class="ln"><span class="row" style="gap:8px"><i class="dot" style="background:${info(r).c}"></i>${info(r).n}</span><span class="num">${P(amtOf(r,net0))}</span></div>`).join('')}<div class="ln t"><span class="${Math.abs(un)<.5?'pos':'warnt'}">${Math.abs(un)<.5?'All placed':un>0?'Not placed yet':'Over by'}</span><span class="num ${Math.abs(un)<.5?'pos':'warnt'}">${P(un)}</span></div></div>`:'';
 return `<div class="slip"><div class="hd"><div><div class="lbl">Bonus payslip</div><div class="disp" style="font-size:22px">${i>=1?T.n+' · '+BY.ymLabel(S.month):'Pick a type'}</div></div><span class="pill ${T.rec==='once'?'warn':''}">${T.rec==='once'?'One-off':'Yearly'}</span></div>
 <div class="sec"><h3>Earnings</h3><div class="ln"><span>Gross<span class="m">${T.f==='base'?'1 month of base':T.f==='cip'?'Last year’s earnings × '+S.comp+'% × '+S.mult:'As announced'}</span></span><span class="num">${P(c.g)}</span></div></div>
 <div class="sec"><h3>Tax-free</h3><div class="ln"><span>De minimis<span class="m">${S.type==='13th'?'None for the 13th month':'Slice that never counts'}</span></span><span class="num">−${P(c.dm)}</span></div></div>
 <div class="sec"><h3>Yearly cap</h3><div class="ln"><span>Counts toward the cap<span class="m">Room before this one: ${P(c.rm)} of ${P(BY.CAP)}</span></span><span class="num">${P(c.ex)}</span></div><div class="bar" role="img" aria-label="Cap use"><i style="width:${Math.min(100,(BY.CAP-c.rm+c.ex)/BY.CAP*100)}%;background:${c.over?'var(--gold)':'var(--accent)'}"></i></div>
  <div class="ln" style="margin-top:6px"><span>Over the cap, taxed at ${c.rate*100}%<span class="m">${c.over?P(c.over)+' goes past the cap':'Nothing goes past the cap'}</span></span><span class="num ${c.tax?'warnt':''}">−${P(c.tax)}</span></div></div>
 ${split}<div class="net"><div><div class="lbl" style="color:var(--accent-text)">Net to you</div><div class="xs muted">${P(c.after)} of cap room left after</div></div><b class="n num">${P(c.net)}</b></div></div>`}
const steps=[
 {label:'Type',title:'What kind of bonus?',sub:'Yearly ones repeat every year. One-offs happen once.',
  body:S=>`<div class="choice" role="radiogroup" aria-label="Type">${Object.entries(TYPES).map(([v,t])=>`<label><input type="radio" name="t" data-k="type" value="${v}" ${S.type===v?'checked':''}>${t.n}<small>${t.desc}</small></label>`).join('')}</div>`,
  onchange:(S,t,api)=>{if(t.dataset.k==='type'){setType(S.type)}}},
 {label:'When and how much',title:'When, and how much?',sub:'Yearly bonuses follow your salary timeline. One-offs use the amount you enter.',
  onchange:(S)=>{S.rows=null},
  body:S=>{const T=TYPES[S.type];return `<div class="frm"><div class="two"><label class="field">${T.rec==='once'?'Month it lands':'Month it lands each year'}<select data-k="month">${mopts()}</select></label>${S.type==='custom'||S.type==='once'?`<label class="field">Name<input data-k="name" value="${S.name||(S.type==='once'?'Retention bonus':'Perfect attendance')}"></label>`:'<span></span>'}</div>
   ${T.f==='cip'?`<div class="two"><label class="field">Component (% of eligible earnings)<input data-k="comp" data-n inputmode="decimal" value="${S.comp}"></label><div class="field">Multiplier<div class="seg" role="group" aria-label="Multiplier">${[[.5,'Low ×0.5'],[1,'Base ×1.0'],[1.5,'High ×1.5']].map(([v,l])=>`<button data-m="${v}" aria-pressed="${S.mult===v}">${l}</button>`).join('')}</div></div></div>`:''}
   ${T.f==='fixed'?`<div class="two"><label class="field">Amount (₱)<input data-k="fixed" data-n inputmode="decimal" value="${S.fixed}"></label><label class="field">De minimis (₱, tax-free slice)<input data-k="dm" data-n inputmode="decimal" value="${S.dm}"></label></div>`:''}
   ${T.f==='cip'?`<label class="field" style="max-width:260px">De minimis (₱)<input data-k="dm" data-n inputmode="decimal" value="${S.dm}"></label>`:''}
   <label class="field" style="max-width:320px">Lands in the<select data-k="cut"><option value="first" ${S.cut==='first'?'selected':''}>1st cutoff (paid 10th)</option><option value="second" ${S.cut==='second'?'selected':''}>2nd cutoff (paid 25th)</option></select></label>
   ${S.type==='13th'?'<div class="note"><b>One month of base, no de minimis.</b> A raise raises next year’s 13th month automatically.</div>':''}</div>`},
  bind:(r,S,api)=>{r.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{S.mult=+b.dataset.m;api.redo();r.querySelector(`[data-m="${S.mult}"]`).focus()})}},
 {label:'Check the tax',title:'Does this look right?',sub:'This is the working your payslip uses: gross, de minimis, the shared yearly cap, then tax on whatever goes past it.',
  body:S=>{const c=calc();return `<div class="frm"><div class="pre">${c.over?`${P(c.over)} goes past the ${P(BY.CAP)} cap, so ${P(c.tax)} is withheld.`:`Nothing goes past the cap. No tax on this one.`}</div><div class="note"><b>Shared cap:</b> every bonus in a year counts toward one ${P(BY.CAP)} cap, after its own de minimis. The 13th month has none.</div></div>`}},
 {label:'Where it goes',title:'Where should it go?',sub:'Treat it like a mini budget: funds, gifts, a big purchase, a loan. Anything not saved is spent on purpose.',ok:S=>Math.abs(calc().net-sumAmt(calc().net))<.5,
  body:S=>{const c=calc(),rs=rows(),used=rs.filter(r=>!r.custom).map(r=>r.id),av=Object.keys(DEST).filter(id=>!used.includes(id)),un=c.net-sumAmt(c.net);
   return `<div>${rs.map((r,i)=>{const f=info(r);return `<div class="sr-row"><span class="grow">${r.custom?`<input class="lbl-in" data-lb="${i}" value="${r.label||''}" placeholder="What is it for?" aria-label="Name of this destination">`:`<b>${f.n}</b>`} <span class="tkn">${f.k}</span></span><span class="seg" role="group" aria-label="Enter as" style="padding:2px"><button data-mode="${i}|amt" aria-pressed="${r.mode==='amt'}" style="padding:4px 10px;min-height:32px">₱</button><button data-mode="${i}|pct" aria-pressed="${r.mode==='pct'}" style="padding:4px 10px;min-height:32px">%</button></span><input data-p="${i}" value="${Math.round(r.v*100)/100}" inputmode="decimal" aria-label="${r.mode==='pct'?'Percent':'Amount in pesos'} for ${f.n}"><span class="num xs muted" style="min-width:90px;text-align:right">${r.mode==='pct'?P(amtOf(r,c.net)):''}</span><button class="iconbtn s" data-rm="${i}" aria-label="Remove ${f.n}">${icon('x')}</button></div>`}).join('')}
   <div class="sr-row"><span class="grow ${Math.abs(un)<.5?'pos':'warnt'}"><b>${Math.abs(un)<.5?'All placed':un>0?'Not placed yet':'Over by'}</b></span><b class="num ${Math.abs(un)<.5?'pos':'warnt'}">${P(un)}</b></div>
   <div class="addbox"><div class="lbl" style="margin-bottom:6px">Add a destination</div><div class="row wrap" style="gap:8px"><input class="lbl-in" data-cn placeholder="Name it, e.g. Mom’s birthday gift" aria-label="Name of the new destination" style="flex:1;min-width:180px"><input class="lbl-in" data-ca inputmode="decimal" placeholder="₱ amount" aria-label="Amount in pesos" style="width:120px"><button class="btn sm pri" data-cadd>Add</button></div>${av.length?`<div class="row wrap" style="gap:6px;margin-top:10px"><span class="xs muted">Or pick one:</span>${av.map(id=>`<button class="btn sm" data-kadd="${id}">${DEST[id].n}</button>`).join('')}</div>`:''}</div></div>
   ${S.type==='13th'?'<p class="xs muted">Tip: the 13th month suits gifts. Add a custom one, like "Mom\'s birthday".</p>':S.type==='cip'?'<p class="xs muted">Tip: CIP suits big purchases. They are spent, not saved.</p>':''}`},
  bind:(r,S,api)=>{const net=calc().net;
   r.querySelectorAll('[data-p]').forEach(i=>i.onchange=()=>{S.rows[+i.dataset.p].v=parseFloat(i.value)||0;api.redo()});
   r.querySelectorAll('[data-lb]').forEach(i=>i.onchange=()=>{S.rows[+i.dataset.lb].label=i.value;api.slip()});
   r.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{S.rows.splice(+b.dataset.rm,1);api.redo()});
   r.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{const [k,m]=b.dataset.mode.split('|'),x=S.rows[+k];if(x.mode!==m){const a=amtOf(x,net);x.mode=m;x.v=m==='pct'?Math.round(a/net*10000)/100:Math.round(a*100)/100}api.redo();r.querySelector('[data-mode="'+b.dataset.mode+'"]').focus()});
   const add=()=>{const n=r.querySelector('[data-cn]').value.trim(),am=parseFloat(r.querySelector('[data-ca]').value)||0;if(!n){r.querySelector('[data-cn]').focus();return}S.rows.push({id:'c'+(++cid),custom:1,label:n,mode:'amt',v:am});api.redo();r.querySelector('[data-cn]').focus()};
   r.querySelector('[data-cadd]').onclick=add;r.querySelectorAll('[data-cn],[data-ca]').forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();add()}}));
   r.querySelectorAll('[data-kadd]').forEach(b=>b.onclick=()=>{const left=Math.max(0,net-sumAmt(net));S.rows.push({id:b.dataset.kadd,mode:'amt',v:Math.round(left)});api.redo()})}},
 {label:'Save',title:'Ready to save',sub:'Forecast uses the plan for the future and your real numbers once it lands.',final:true,
  body:S=>{const c=calc(),T=TYPES[S.type];return `<div class="stack"><div class="card flat" style="padding:0"><div class="row sp"><b>${S.name&&(S.type==='custom'||S.type==='once')?S.name:T.n}</b><span class="pill ${T.rec==='once'?'warn':''}">${T.rec==='once'?'One-off':'Every year'} · ${BY.ymLabel(S.month)}</span></div><div class="sm muted" style="margin-top:6px">${P(c.g)} gross → ${P(c.net)} net, all placed.</div></div><div class="row wrap" style="gap:10px"><button class="btn pri" id="save">${EM&&EK[EM]?'Save changes':'Save bonus'}</button><button class="btn" id="back">Back</button></div><div id="done" role="status"></div></div>`},
  bind:(r,S,api)=>{r.querySelector('#back').onclick=()=>api.go(3);r.querySelector('#save').onclick=()=>{const pp=loadPlace();pp[PK[S.type]]=S.cut;savePlace(pp);r.querySelector('#done').innerHTML=`<div class="flag" style="background:var(--tint);color:var(--accent-text)"><span>✓</span><span><b>Saved (mockup).</b> <a href="v13-bonus.html">See it on Bonuses</a>.</span></div>`}}},
];
Wiz({root:$('#app'),title:EM&&EK[EM]?'Edit a bonus':'Plan a bonus',steps,S,slip,close:'v13-bonus.html',start:EM&&EK[EM]?1:0});
</script></body></html>
